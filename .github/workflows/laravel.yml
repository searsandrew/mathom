name: Laravel

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, bcmath, intl, pcntl, dom, fileinfo
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install PHP deps
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend deps
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create & Migrate SQLite DB
        env:
          APP_ENV: testing
          APP_DEBUG: true
          LOG_CHANNEL: stderr
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          mkdir -p database
          touch database/database.sqlite
          php artisan config:clear
          php artisan migrate --force

      - name: Run tests (quiet)
        id: run_tests
        env:
          APP_ENV: testing
          APP_DEBUG: true
          LOG_CHANNEL: stderr
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          set +e
          php artisan test --testdox
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          exit 0

      - name: Rerun failed tests verbose
        if: steps.run_tests.outputs.exit_code != '0'
        env:
          APP_ENV: testing
          APP_DEBUG: true
          LOG_CHANNEL: stderr
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test -v --stop-on-failure --order-by=defects

      - name: Tail laravel.log on failure
        if: failure()
        run: |
          test -f storage/logs/laravel.log && tail -n 400 storage/logs/laravel.log || echo "No laravel.log"
